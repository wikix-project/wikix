name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest --cov=wikix
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          uv run python -c "import importlib.metadata as m, os, sys;
          expected = 'v' + m.version('wikix'); actual = os.environ['RELEASE_TAG'];
          sys.exit(0 if actual == expected else f'tag {actual} does not match {expected}')"
      - run: uv build
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/wikix.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate SHA-256 checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: wikix-release
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wikix
    permissions:
      id-token: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: wikix-release
          path: release
      - name: Select Python distributions
        run: |
          mkdir dist
          cp release/*.whl release/*.tar.gz dist/
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  provenance:
    name: Attest and create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: wikix-release
          path: dist
      - name: Attest release bundle
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
